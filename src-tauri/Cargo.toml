[package]
name = "limitlane"
description = "Claude usage limits, forecast and cost per project in the macOS menu bar and the Windows notification area"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "limitlane"

[features]
# Builds the console CLI below. The Windows installer ships it, because the
# app is a GUI program and PowerShell does not wait for those to finish, which
# the statusline hook needs.
cli-exe = []

[[bin]]
name = "limitlane-cli"
path = "src/cli.rs"
required-features = ["cli-exe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
limitlane-core = { path = "../crates/core" }
limitlane-cli = { path = "../crates/cli" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The popover is a non-activating NSPanel, so it opens over full-screen apps.
tauri-nspanel = "2.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPanel", "NSResponder", "NSWindow"] }
