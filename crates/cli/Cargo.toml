[package]
name = "paceline-cli"
description = "Command-line companion for Paceline"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "paceline-cli"
path = "src/main.rs"

[dependencies]
paceline-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
