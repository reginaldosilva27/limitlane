<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Limitlane demo stage</title>
<!--
  A staged desktop for docs/demo.gif: a menu bar, a terminal running Claude
  Code, and the real popover from ui/ fed with generated demo data through a
  stubbed window.__TAURI__ (popover-mock.js). record.mjs steps `demo.frame(t)` and screenshots
  each frame; opening this page over http also plays it in real time.
-->
<style>
  :root { --w: 1000px; --h: 690px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0d14; }
  #stage {
    position: relative; width: var(--w); height: var(--h); overflow: hidden;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: #eef0f3;
    background:
      radial-gradient(1100px 700px at 85% 110%, #4a2f7a 0%, transparent 60%),
      radial-gradient(900px 600px at 0% 0%, #1d3b6b 0%, transparent 55%),
      linear-gradient(160deg, #141a2e, #1b1530);
  }

  /* menu bar */
  .menubar {
    position: absolute; inset: 0 0 auto 0; height: 26px; display: flex; align-items: center;
    padding: 0 10px; gap: 16px; background: rgba(14, 16, 26, 0.55); backdrop-filter: blur(20px);
    font-size: 13px; color: rgba(255, 255, 255, 0.92);
  }
  .menubar .left { display: flex; gap: 17px; align-items: center; flex: 1; }
  .menubar .left b { font-weight: 650; }
  .menubar .glyph { width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(135deg, #9aa7ff, #c48bff); }
  .menubar .right { display: flex; align-items: center; gap: 14px; }
  .tray { display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 5px; font-variant-numeric: tabular-nums; }
  .tray.pressed { background: rgba(255, 255, 255, 0.22); }
  .tray canvas { width: 20px; height: 18px; }
  .sys { width: 17px; height: 17px; fill: none; stroke: rgba(255,255,255,.9); stroke-width: 1.6; stroke-linecap: round; }

  /* terminal */
  .term {
    position: absolute; left: 26px; top: 62px; width: 560px; height: 350px;
    background: rgba(18, 20, 27, 0.96); border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 11px;
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5); overflow: hidden; display: flex; flex-direction: column;
  }
  .term-bar { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.06); }
  .term-bar i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .term-bar i:nth-child(2) { background: #febc2e; }
  .term-bar i:nth-child(3) { background: #28c840; }
  .term-bar span { flex: 1; text-align: center; margin-right: 52px; color: rgba(255,255,255,0.55); font-size: 12px; }
  .term-body { flex: 1; padding: 14px 16px; font: 12.5px/1.65 "SF Mono", Menlo, monospace; color: #d8dbe2; white-space: pre-wrap; }
  .term-body .dim { color: #7c8496; }
  .term-body .you { color: #eef0f3; }
  .term-body .tool { color: #a48bf0; }
  .term-body .ok { color: #4cc38a; }
  .term-body .caret { display: inline-block; width: 7px; height: 15px; background: #d8dbe2; vertical-align: -3px; }
  .term-status { padding: 7px 16px 9px; border-top: 1px solid rgba(255,255,255,0.07); font: 12px/1.4 "SF Mono", Menlo, monospace; color: #949cab; font-variant-numeric: tabular-nums; }
  .term-status b { color: #eef0f3; font-weight: 500; }
  .term-status .warn { color: #f0a23b; }

  /* notification banner */
  .notif {
    position: absolute; top: 36px; right: 12px; width: 344px; padding: 11px 13px; display: flex; gap: 11px;
    background: rgba(44, 46, 56, 0.92); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; box-shadow: 0 12px 34px rgba(0,0,0,0.45); opacity: 0;
  }
  .notif img { width: 34px; height: 34px; flex: none; }
  .notif .t { font-weight: 650; display: flex; }
  .notif .t span { flex: 1; }
  .notif .t small { color: #949cab; font-weight: 400; }
  .notif p { margin: 1px 0 0; color: #d0d4dc; font-size: 12.5px; line-height: 1.35; }

  /* popover: the real UI */
  .popover { position: absolute; top: 30px; left: 600px; width: 384px; height: 640px; opacity: 0; filter: drop-shadow(0 18px 40px rgba(0,0,0,0.5)); }
  .popover iframe { width: 100%; height: 100%; border: 0; background: transparent; color-scheme: dark; }

  /* caption */
  .caption {
    position: absolute; left: 26px; bottom: 26px; max-width: 540px; padding: 9px 15px 10px; border-radius: 12px;
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(14px);
    font: 600 17px/1.3 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; letter-spacing: -0.01em;
  }
  .caption small { display: block; font: 400 12.5px/1.35 -apple-system, sans-serif; color: rgba(255,255,255,0.7); margin-top: 2px; letter-spacing: 0; }

  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 28px; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45)); transform-origin: 3px 3px; }
  #fade { position: absolute; inset: 0; background: #0b0d14; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <header class="menubar">
    <div class="left"><span class="glyph"></span><b>Terminal</b><span>Shell</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span></div>
    <div class="right">
      <div id="tray" class="tray"><canvas id="meter" width="40" height="36"></canvas><span id="tray-title"></span></div>
      <svg class="sys" viewBox="0 0 20 20"><path d="M3 8a10 10 0 0 1 14 0M5.5 10.8a6.5 6.5 0 0 1 9 0M8 13.5a3 3 0 0 1 4 0"/><circle cx="10" cy="16" r=".6" fill="#fff"/></svg>
      <svg class="sys" viewBox="0 0 26 20" style="width:24px"><rect x="2" y="5.5" width="19" height="9" rx="2.5"/><rect x="4" y="7.5" width="12" height="5" rx="1" fill="rgba(255,255,255,.9)" stroke="none"/><path d="M23.5 8.5v3"/></svg>
      <span>Fri 9:12 AM</span>
    </div>
  </header>

  <section class="term">
    <div class="term-bar"><i></i><i></i><i></i><span>acme-api — claude</span></div>
    <div class="term-body" id="term"></div>
    <div class="term-status" id="statusline"></div>
  </section>

  <div id="notif" class="notif">
    <img src="../../docs/logo.png" alt="">
    <div>
      <div class="t"><span>On pace to hit the 5-hour limit</span><small>now</small></div>
      <p>At 64% now, about 50m until 100%, which is 1h 20m before it resets.</p>
    </div>
  </div>

  <div id="popover" class="popover"><iframe id="ui" title="Limitlane popover"></iframe></div>
  <div id="caption" class="caption"></div>
  <svg id="cursor" viewBox="0 0 22 28"><path d="M3 2.5v20.2l5.1-4.9 3.3 7.7 3.6-1.5-3.3-7.6h7z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>
  <div id="fade"></div>
</div>

<script src="demo-data.js"></script>
<script src="popover-mock.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // ---------- the popover ----------
  const uiReady = window.LimitlaneDemo.mount($("ui"));
  const ui = () => $("ui").contentDocument;
  const uiButton = (sel) => ui().querySelector(sel);

  // ---------- menu bar meter (same drawing as crates/core/src/icon.rs) ----------
  function drawMeter(five, week) {
    const c = $("meter").getContext("2d");
    c.clearRect(0, 0, 40, 36);
    [[5, five], [20, week]].forEach(([top, v]) => {
      const round = (w) => { c.beginPath(); c.roundRect(2, top, w, 11, 3); c.fill(); };
      c.fillStyle = "rgba(255,255,255,0.47)"; round(36);
      c.fillStyle = "#fff"; if (v > 0) round(Math.max(3, Math.round((v / 100) * 36)));
    });
  }

  // ---------- timeline ----------
  const DURATION_S = 17;
  const DURATION = DURATION_S;
  const PROMPT = "add retry with backoff to the payment client";
  // [time (s), 5-hour %, weekly %, context %, terminal lines]
  const STEPS = [
    [0, 41, 37.4, 22, []],
    [2.9, 47, 37.6, 24, ['<span class="tool">●</span> Read <span class="dim">src/payments/client.ts</span>']],
    [3.5, 53, 37.8, 27, ['<span class="tool">●</span> Edit <span class="dim">src/payments/client.ts</span>  <span class="ok">+42</span> <span class="dim">−7</span>']],
    [4.1, 58, 38.0, 29, ['<span class="tool">●</span> Bash <span class="dim">npm test</span>', '  <span class="dim">└</span> <span class="ok">128 passed</span>']],
    [4.7, 64, 38.2, 31, ['<span class="tool">●</span> Retries now back off exponentially with jitter,', '  capped at 5 attempts.']],
  ];
  const CAPTIONS = [
    [0, "Use Claude Code as usual", "Limitlane reads the limits Claude Code reports. No login, no network calls."],
    [4.9, "Live limits in your menu bar", "And a heads-up before the pace runs you into the limit."],
    [8.3, "When you will hit the limit", "At the current pace, for the 5-hour and weekly windows."],
    [10.6, "Cost per project and per day", "API-equivalent cost for today, 7 or 30 days."],
    [13.5, "Context left in every session", ""],
  ];
  // Cursor keyframes: [time (s), x, y] or [time (s), selector]. Selectors
  // starting with "ui:" are looked up inside the popover.
  const PATH = [
    [0, 360, 300], [5.9, 360, 300], [7.1, "#tray"], [8.6, "#tray"],
    [9.5, 'ui:#range [data-days="7"]'], [10.4, 'ui:#range [data-days="7"]'],
    [11.0, 'ui:#tabs [data-tab="days"]'], [12.0, 'ui:#tabs [data-tab="days"]'],
    [12.6, 'ui:#range [data-days="30"]'], [13.5, 'ui:#range [data-days="30"]'],
    [14.2, 'ui:#tabs [data-tab="sessions"]'], [DURATION_S, 'ui:#tabs [data-tab="sessions"]'],
  ];
  // Centre of a keyframe's target, in stage coordinates.
  function point(k) {
    if (typeof k[1] === "number") return [k[1], k[2]];
    if (k[1].startsWith("ui:")) {
      const r = ui().querySelector(k[1].slice(3)).getBoundingClientRect();
      const pop = $("popover");
      return [pop.offsetLeft + r.left + r.width / 2, pop.offsetTop + r.top + r.height / 2];
    }
    const r = document.querySelector(k[1]).getBoundingClientRect();
    const stage = $("stage").getBoundingClientRect();
    return [r.left - stage.left + r.width / 2, r.top - stage.top + r.height / 2];
  }
  const CLICKS = [7.45, 9.9, 11.25, 12.85, 14.45]; // press feedback
  const CUES = [
    [7.5, () => { $("tray").classList.add("pressed"); }],
    [9.95, () => uiButton('#range [data-days="7"]').click()],
    [11.3, () => uiButton('#tabs [data-tab="days"]').click()],
    [12.9, () => uiButton('#range [data-days="30"]').click()],
    [14.5, () => uiButton('#tabs [data-tab="sessions"]').click()],
  ];

  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const ramp = (t, a, b) => clamp01((t - a) / (b - a));

  function cursorAt(t) {
    for (let i = 1; i < PATH.length; i++) {
      const t0 = PATH[i - 1][0], t1 = PATH[i][0];
      if (t <= t1) {
        const [x0, y0] = point(PATH[i - 1]), [x1, y1] = point(PATH[i]);
        const k = ease(ramp(t, t0, t1));
        return [x0 + (x1 - x0) * k, y0 + (y1 - y0) * k];
      }
    }
    return point(PATH[PATH.length - 1]);
  }

  function fmtPct(v) { return `${Math.round(v)}%`; }

  let fired = 0;
  async function frame(ms) {
    const t = ms / 1000;
    if (t === 0) fired = 0;

    // Terminal and the live numbers.
    const step = [...STEPS].reverse().find((s) => t >= s[0]);
    const [, five, week, ctx] = step;
    const typed = PROMPT.slice(0, Math.floor(ramp(t, 0.9, 2.5) * PROMPT.length));
    const lines = ['<span class="dim">~/code/acme-api</span>', '', `<span class="dim">&gt;</span> <span class="you">${typed}</span>${t < 2.75 ? '<span class="caret"></span>' : ""}`, ""];
    for (const s of STEPS) if (t >= s[0]) lines.push(...s[4]);
    $("term").innerHTML = lines.join("\n");
    $("statusline").innerHTML = `<b>Fable</b> · 5h <span class="${five >= 60 ? "warn" : ""}">${fmtPct(five)}</span> (2h 10m) · 7d ${fmtPct(week)} · ctx ${ctx}%`;
    $("tray-title").textContent = `${fmtPct(five)} · ${fmtPct(week)}`;
    drawMeter(five, week);

    // Notification banner.
    const nIn = ease(ramp(t, 4.95, 5.35)), nOut = ramp(t, 6.9, 7.2);
    $("notif").style.opacity = String(nIn * (1 - nOut));
    $("notif").style.transform = `translateX(${(1 - nIn) * 40}px)`;

    // Popover.
    const pIn = ease(ramp(t, 7.55, 7.85));
    $("popover").style.opacity = String(pIn);
    $("popover").style.transform = `translateY(${(1 - pIn) * -6}px) scale(${0.98 + pIn * 0.02})`;

    // Captions.
    const cap = [...CAPTIONS].reverse().find((c) => t >= c[0]);
    const capEl = $("caption");
    if (capEl.dataset.k !== String(cap[0])) {
      capEl.dataset.k = String(cap[0]);
      capEl.innerHTML = "";
      capEl.append(cap[1]);
      if (cap[2]) { const s = document.createElement("small"); s.textContent = cap[2]; capEl.append(s); }
    }
    capEl.style.opacity = cap[0] === 0 ? "1" : String(ramp(t, cap[0], cap[0] + 0.3));

    // Cursor with a small press on each click.
    const [x, y] = cursorAt(t);
    const press = CLICKS.some((c) => t >= c && t < c + 0.15);
    $("cursor").style.transform = `translate(${x - 3}px, ${y - 3}px) scale(${press ? 0.86 : 1})`;
    if (t > 7.75) $("tray").classList.remove("pressed");

    // Fade out before the loop restarts. The first frame stays a full scene:
    // it is what viewers with animation turned off see.
    $("fade").style.opacity = String(ramp(t, DURATION - 0.6, DURATION));

    // One-off actions inside the popover.
    let changed = false;
    while (fired < CUES.length && t >= CUES[fired][0]) { CUES[fired][1](); fired++; changed = true; }
    if (changed) await new Promise((r) => setTimeout(r, 30));
  }

  // Put the popover under the tray item, kept 8 px inside the screen edge.
  const tray = $("tray").getBoundingClientRect();
  const stageW = $("stage").clientWidth;
  $("popover").style.left = `${Math.min(Math.max(8, tray.left + tray.width / 2 - 192), stageW - 384 - 8)}px`;

  window.demo = { ready: uiReady, frame, duration: DURATION };

  // Real-time playback when opened directly in a browser.
  if (!navigator.webdriver) {
    uiReady.then(() => {
      const start = performance.now();
      const tick = () => {
        const ms = (performance.now() - start) % (DURATION * 1000);
        if (ms < 40) { fired = 0; ui().querySelector('#range [data-days="1"]').click(); ui().querySelector('#tabs [data-tab="projects"]').click(); }
        frame(ms);
        requestAnimationFrame(tick);
      };
      tick();
    });
  }
})();
</script>
</body>
</html>
